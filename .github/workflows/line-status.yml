name: Status alerts (LINE API + Meta)

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may delay runs a few minutes)
  workflow_dispatch: {}       # allow manual "Run workflow"

permissions:
  contents: write             # to commit state files (dedupe memory)

concurrency:
  group: status-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_TO: ${{ secrets.LINE_TO }}
      GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: LINE API status
        id: line
        continue-on-error: true
        run: python monitor.py

      - name: Meta status (Messenger, Instagram messaging)
        id: meta
        continue-on-error: true
        run: python meta_monitor.py

      - name: Save dedupe state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json meta_state.json)" ]; then
            git config user.name "status-alert-bot"
            git config user.email "status-alert-bot@users.noreply.github.com"
            git add state.json meta_state.json 2>/dev/null || git add state.json
            git commit -m "chore: update status state [skip ci]"
            git push
          fi

      - name: Fail run if a check failed
        if: steps.line.outcome == 'failure' || steps.meta.outcome == 'failure'
        run: exit 1
